questions:
  - key: arr-index-last
    type: single_choice
    skills: [array-indexing]
    difficulty: 1
    stem: "An array `a` has length 8. Which index refers to its **last** element?"
    options:
      - text: "7"
        correct: true
        why: "Indices start at 0, so the last of 8 elements is at 8 − 1 = 7."
      - text: "8"
        why: "Index 8 is one past the end. Accessing it is out of bounds."
      - text: "1"
        why: "Index 1 is the second element."
      - text: "-1"
        why: "Java has no negative indices; a[-1] throws an exception."
    hints:
      - "Indices start at 0, not 1."
      - "If the first index is 0, the last is length − 1."
  - key: arr-index-value
    type: numeric
    skills: [array-indexing]
    difficulty: 1
    stem: "Given `int[] a = {7, 3, 9, 1, 8};`, what is the value of `a[2]`?"
    answer: 9
    hints:
      - "Count from 0: a[0] = 7, a[1] = 3, …"
    explanation: "a[0] = 7, a[1] = 3, a[2] = 9."
  - key: arr-out-of-bounds
    type: single_choice
    skills: [array-indexing, array-traversal]
    difficulty: 2
    stem: |
      What happens when this Java code runs?

      ```java
      int[] a = new int[5];
      for (int i = 0; i <= a.length; i++) {
          a[i] = i;
      }
      ```
    options:
      - text: "It throws ArrayIndexOutOfBoundsException"
        correct: true
        why: "The loop runs with i = 5, and a[5] does not exist (valid indices are 0 to 4)."
      - text: "It fills the array with 0, 1, 2, 3, 4"
        why: "That would happen with i < a.length. The <= adds one more iteration."
      - text: "It fills the array with 0 to 5"
        why: "An array of length 5 cannot hold 6 values."
      - text: "It compiles with an error"
        why: "This compiles fine. The problem only appears at run time."
    hints:
      - "Check the last value i takes."
      - "What are the valid indices of an array of length 5?"
  - key: arr-sum-loop
    type: numeric
    skills: [array-traversal]
    difficulty: 1
    stem: |
      What does this print?

      ```java
      int[] a = {2, 4, 6, 8};
      int s = 0;
      for (int i = 0; i < a.length; i += 2) s += a[i];
      System.out.println(s);
      ```
    answer: 8
    hints:
      - "i goes 0, 2, then stops at 4."
    explanation: "Only a[0] = 2 and a[2] = 6 are added: 2 + 6 = 8."
  - key: arr-find-max
    type: single_choice
    skills: [array-traversal]
    difficulty: 2
    stem: "To find the maximum of an **unsorted** array of n numbers, how many elements must you look at in the worst case?"
    options:
      - text: "All n"
        correct: true
        why: "Any element you skip could be the maximum."
      - text: "About n / 2"
        why: "Skipping half the elements could skip the maximum."
      - text: "About log₂ n"
        why: "Halving only works when the data is sorted."
      - text: "Just 1"
        why: "One element tells you nothing about the others."
  - key: arr-insert-front-cost
    type: single_choice
    skills: [array-insert-delete, array-complexity]
    difficulty: 2
    stem: "Inserting a value at index 0 of an array holding n elements (with spare capacity) costs:"
    options:
      - text: "O(n)"
        correct: true
        why: "All n existing elements must shift one place right."
      - text: "O(1)"
        why: "That's the cost of writing to a slot, not of making room at the front."
      - text: "O(log n)"
        why: "There is no halving here; every element moves."
      - text: "O(n²)"
        why: "Each element moves once, so it's linear, not quadratic."
    hints:
      - "What happens to the element that was at index 0?"
  - key: arr-delete-shift
    type: short_text
    skills: [array-insert-delete]
    difficulty: 2
    stem: "The array `[5, 8, 1, 9, 4]` has the element at index 1 deleted by shifting. Write the resulting first four elements, comma-separated."
    accepted: ["5, 1, 9, 4"]
    hints:
      - "Remove 8, then move everything after it one place left."
    explanation: "8 is removed; 1, 9 and 4 shift left: 5, 1, 9, 4."
  - key: arr-complexity-match
    type: multi_choice
    skills: [array-complexity]
    difficulty: 3
    stem: "Which of these array operations are **O(1)**? Select all that apply."
    options:
      - text: "Reading a[i]"
        correct: true
        why: "The address is computed directly from i."
      - text: "Writing a[i] = x"
        correct: true
        why: "Same direct address calculation as reading."
      - text: "Searching an unsorted array for x"
        why: "You may need to check every element: O(n)."
      - text: "Inserting at index 0"
        why: "Every element shifts: O(n)."
  - key: arr-why-constant
    type: single_choice
    skills: [array-complexity, array-indexing]
    difficulty: 3
    stem: "Why can an array reach `a[1000000]` as fast as `a[0]`?"
    options:
      - text: "The address is start + index × element size, a single calculation"
        correct: true
        why: "Equal-sized, contiguous slots make the address computable without searching."
      - text: "The computer caches every element in advance"
        why: "Caching helps, but the real reason is the address formula."
      - text: "Arrays are stored as trees internally"
        why: "Arrays are contiguous blocks, not trees."
      - text: "It isn't. Larger indices take longer"
        why: "Array access is O(1) regardless of the index."
