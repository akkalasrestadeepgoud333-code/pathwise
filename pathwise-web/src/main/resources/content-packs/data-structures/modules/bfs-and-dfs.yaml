key: bfs-and-dfs
topic: graph-traversal
title: "BFS and DFS: exploring a graph"
summary: Breadth-first spreads out level by level with a queue. Depth-first dives deep with a stack.
objectives:
  - Run BFS from a start vertex using a queue
  - Run DFS using a stack or recursion
  - Use a visited set so cycles don't cause infinite loops
estMinutes: 20
difficulty: 3
skills: [bfs, dfs, visited-set]
sections:
  - kind: overview
    title: Same goal, different order
    markdown: |
      Both algorithms visit every vertex **reachable** from a start vertex. They differ in which
      waiting vertex they explore next:

      - **BFS (breadth-first)** uses a **queue**. It visits everything 1 edge away, then 2 edges away,
        and so on. On an unweighted graph it finds **shortest paths**.
      - **DFS (depth-first)** uses a **stack** (or recursion). It follows one path as deep as possible,
        then backtracks. Use it for cycle detection, topological sorting and maze solving.

      These are exactly level-order and preorder traversal, generalised from trees to graphs.

  - kind: visual
    title: Run both on the same graph
    alt: >-
      A graph with vertices A to F. Edges: A–B, A–C, B–D, C–D, C–E, D–F, E–F. Starting from A, BFS
      visits A, B, C, D, E, F. DFS with neighbours taken in alphabetical order visits A, B, D, C, E, F.
    markdown: Neighbours are explored in alphabetical order. Watch how the queue and the stack change the visiting order.
    visual:
      type: graph-search
      nodes: [A, B, C, D, E, F]
      edges: [[A, B], [A, C], [B, D], [C, D], [C, E], [D, F], [E, F]]
