      positions: { A: [60, 150], B: [160, 60], C: [160, 240], D: [270, 150], E: [270, 270], F: [370, 200] }

  - kind: explanation
    title: The code
    markdown: |
      ```java
      List<String> bfs(Map<String, List<String>> graph, String start) {
          List<String> order = new ArrayList<>();
          Set<String> visited = new HashSet<>(List.of(start));
          Queue<String> queue = new ArrayDeque<>(List.of(start));
          while (!queue.isEmpty()) {
              String v = queue.remove();
              order.add(v);
              for (String w : graph.get(v)) {
                  if (visited.add(w)) queue.add(w);   // mark when enqueued
              }
          }
          return order;
      }

      void dfs(Map<String, List<String>> graph, String v, Set<String> visited, List<String> order) {
          if (!visited.add(v)) return;     // already seen: stop (this is what handles cycles)
          order.add(v);
          for (String w : graph.get(v)) dfs(graph, w, visited, order);
      }
      ```

      Without the **visited** set, the cycle A–B–D–C–A would loop forever. Each vertex and each edge is
      handled once, so both algorithms run in **O(V + E)** with adjacency lists.

  - kind: flashcards
    title: Quick recall
    cards:
      - front: Data structure behind BFS
        back: A **queue** (FIFO).
        skill: bfs
      - front: Data structure behind DFS
        back: A **stack**, either explicit or the call stack in recursion.
        skill: dfs
      - front: Why keep a visited set?
        back: Graphs can have **cycles**. Without it you'd revisit vertices forever.
        skill: visited-set
      - front: Which finds shortest paths in an unweighted graph?
        back: "**BFS.**"
        skill: bfs
      - front: Running time with adjacency lists
        back: "**O(V + E)** for both."
        skill: dfs

  - kind: check
    title: Check your understanding
    markdown: Answer these to see how well it has sunk in. Your answers help Pathwise suggest what to do next.
    questions: [bfs-order, dfs-structure, visited-why]

  - kind: summary
    title: Summary
    markdown: |
      - BFS uses a queue and goes level by level. It finds shortest paths when edges are unweighted.
      - DFS uses a stack or recursion and goes deep first. Use it for cycles, topological order and
        backtracking.
      - Always track **visited** vertices. Both run in O(V + E).

