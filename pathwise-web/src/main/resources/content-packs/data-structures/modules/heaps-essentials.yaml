key: heaps-essentials
topic: heaps
title: "Heaps and priority queues"
summary: A complete binary tree stored in an array, always ready to hand you the smallest (or largest) item.
objectives:
  - State the min-heap and max-heap property
  - Find a node's parent and children from its array index
  - Insert with sift-up and remove the root with sift-down
estMinutes: 18
difficulty: 3
skills: [heap-property, heap-array-index, heap-insert, heap-extract]
sections:
  - kind: overview
    title: Always know the minimum
    markdown: |
      A **min-heap** is a **complete** binary tree where every parent is **≤ its children**. So the
      smallest value is always at the root. (A **max-heap** flips this: every parent is ≥ its children.)

      A heap is **not** sorted. Siblings can be in any order. It promises exactly one thing: the root
      wins. That's all a **priority queue** needs, as in "which task is most urgent?" or "which city is
      closest next?" in Dijkstra's algorithm.

  - kind: visual
    title: A min-heap, as a tree and as an array
    alt: "Min-heap stored as the array [2, 5, 3, 9, 6, 8, 4]. Root 2 has children 5 and 3. 5 has children 9 and 6; 3 has children 8 and 4. Every parent is smaller than its children."
    markdown: "Check the rule at every parent: 2 ≤ 5, 3 · 5 ≤ 9, 6 · 3 ≤ 8, 4. The array is the tree written in level order."
    visual:
      type: tree
      tree: [2, 5, 3, 9, 6, 8, 4]
      caption: "Array [2, 5, 3, 9, 6, 8, 4]: index i has children 2i+1 and 2i+2"

  - kind: explanation
    title: Insert = add at the end, then sift up
    markdown: |
      1. Put the new value in the next free slot, at the end of the array. That keeps the tree complete.
      2. **Sift up**: while it's smaller than its parent at `(i − 1) / 2`, swap them.

      Insert `1` into `[2, 5, 3, 9, 6, 8, 4]`:

      ```
      [2, 5, 3, 9, 6, 8, 4, 1]     1 is at index 7; its parent (index 3) is 9 → swap
      [2, 5, 3, 1, 6, 8, 4, 9]     parent of index 3 is index 1 (5) → swap
      [2, 1, 3, 5, 6, 8, 4, 9]     parent of index 1 is index 0 (2) → swap
      [1, 2, 3, 5, 6, 8, 4, 9]     at the root: done
      ```

      It climbs at most the height, so insertion is **O(log n)**.

  - kind: explanation
    title: Remove the minimum = move the last to the root, then sift down
    markdown: |
      1. Take the root. That's your answer.
      2. Move the **last** element to the root, and shrink the array by one.
      3. **Sift down**: while it's larger than its smaller child, swap with that **smaller** child.

      Swapping with the *smaller* child matters: it guarantees the new parent is ≤ both children.
      Removal is also **O(log n)**, and peeking at the minimum is **O(1)**.

      ```java
      PriorityQueue<Integer> pq = new PriorityQueue<>();   // a min-heap in Java
      pq.add(5); pq.add(1); pq.add(3);
      pq.poll();   // 1
      ```

  - kind: flashcards
    title: Quick recall
    cards:
      - front: Min-heap property
        back: Every parent is **≤** its children, so the minimum is at the root.
        skill: heap-property
      - front: Is a heap sorted?
        back: "**No.** Only parent-child order is guaranteed."
        skill: heap-property
      - front: Parent of index *i*
        back: "`(i − 1) / 2` (integer division)."
        skill: heap-array-index
      - front: In sift-down, which child do you swap with?
        back: The **smaller** child (in a min-heap).
        skill: heap-extract
      - front: Cost of insert and remove-min
        back: "**O(log n)** each. Peeking is O(1)."
        skill: heap-insert

  - kind: summary
    title: Summary
    markdown: |
      - A heap is a complete tree plus parent-beats-children order. It's stored in an array.
      - Insert: append, then sift up. Remove the root: move the last element up, then sift down.
        Both are O(log n).
      - Java's `PriorityQueue` is a min-heap.

  - kind: resources
    title: Go further
    required: false
    links:
      - title: "VisuAlgo: binary heap (interactive)"
        url: https://visualgo.net/en/heap
